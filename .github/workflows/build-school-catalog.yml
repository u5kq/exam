name: Build national school catalog
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-school-catalog.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check pandas openpyxl
      - name: Build catalog from the two official MEXT workbooks
        run: python scripts/build-school-catalog.py
      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add school-catalog.js school-catalog-meta.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "Build national school catalog from MEXT data"
            git push origin main
          fi
